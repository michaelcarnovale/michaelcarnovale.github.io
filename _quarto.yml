project:
  type: website
  output-dir: docs

# Meta
description-meta: "Michael Carnovale Academic Website"
author-meta: "Michael Carnovale"

website:
  title: "Michael Carnovale"
  image: "https://quarto.org/quarto.png"
  description: "Michael Carnovale Academic Website"
 
  navbar:
    background: dark  

    left:   
      - text: About
        href: index.qmd 
      - text: Research 
        href: research.qmd                           
      - text: Teaching 
        href: teaching.qmd
      - text: Critical Psychometrics 
        href: critpsychometrics.qmd
        
    #right: 
     # - text: CV
      #  href: file
    
  page-navigation: true
  
  page-footer: 
    left: "Michael Carnovale &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Built with [Quarto](https://quarto.org/)"
    right:  
      - icon: github
        href: https://github.com/michaelcarnovale
        target: _blank
  
  search:
    location: navbar
    type: overlay
  
  reader-mode: false

  draft-mode: unlinked
  
  repo-url: https://github.com/michaelcarnovale/michaelcarnovale.github.io
#  repo-actions: [edit, issue, source]
  
  open-graph: true
  
  twitter-card: true 
#  card-style: summary      
  
  site-url: "michaelcarnovale.github.io"
  
  google-analytics:
    tracking-id: ""  
    anonymize-ip: true

bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: sandstone
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"

